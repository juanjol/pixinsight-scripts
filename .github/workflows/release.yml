name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build the package
        id: build
        run: |
          set -euo pipefail
          # PixInsight compares releaseDate, so it must always move forwards.
          date=$(date -u -d "@$(git log -1 --format=%ct "$GITHUB_SHA")" +%Y%m%d%H%M)
          echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          rm -rf updates
          python3 tools/build.py --date "$date"

      - name: Assemble the site
        run: |
          set -euo pipefail
          mkdir -p site
          cp web/index.html site/index.html
          cp -r updates site/updates
          touch site/.nojekyll
          find site -type f | sort

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Attach the package to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ steps.build.outputs.tag }}" updates/*.zip \
             --title "${{ steps.build.outputs.tag }}" --generate-notes \
             || gh release upload "${{ steps.build.outputs.tag }}" updates/*.zip --clobber

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
